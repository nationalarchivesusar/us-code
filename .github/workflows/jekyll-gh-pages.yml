name: Build and deploy U.S. Code to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository and Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Fetch codification baseline
        run: git fetch --no-tags --depth=1 origin 00ea0e9b430e4a2eb2253a77d35e6fb125ba5f46

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Apply USAR current-law notes
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_current_law_notes.py
          python tools/apply_current_law_notes.py --check

      - name: Apply substantive 2026 current-law sections
        shell: bash
        run: |
          set -euo pipefail
          python tools/apply_current_law_sections.py
          python tools/apply_current_law_sections.py --check
          python -m unittest tests.test_current_law_sections -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Title 42 source
        shell: bash
        run: |
          set -euo pipefail
          test -s usc/usc42.xml
          if head -n 1 usc/usc42.xml | grep -q "version https://git-lfs.github.com/spec"; then
            echo "::error::usc/usc42.xml is still a Git LFS pointer."
            exit 1
          fi

      - name: Build website data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf data/title-42
          rm -rf data/api/v1/criminal-law
          rm -rf data/api/v1/code
          rm -rf data/section-history data/version-history data/references
          python tools/build_constitution.py
          python tools/build_title42_chunks.py
          python tools/build_index.py
          python tools/build_public_laws_index.py
          python tools/filter_public_laws_for_publication.py
          python tools/build_section_history.py
          python tools/build_version_history.py
          python tools/build_reference_graph.py
          python tools/build_code_api.py
          python tools/build_criminal_law_api.py
          python tools/include_dc_booking_charges.py
          python tools/harden_roblox_criminal_api.py
          python tools/finalize_roblox_criminal_api.py
          python tools/harden_roblox_criminal_api.py --check
          python tools/finalize_roblox_criminal_api.py --check
          test -s data/constitution.txt
          test -s data/constitution-meta.json
          test -s data/titles.json
          test -s data/title-42/manifest.json
          test -s data/public-laws.json
          test -s data/section-history/manifest.json
          test -s data/version-history/manifest.json
          test -s data/references/manifest.json
          test -s data/api/v1/code/index.json
          test -s data/api/v1/criminal-law/manifest.json
          test -s data/api/v1/criminal-law/charges.json
          test ! -e data/api/v1/criminal-law/federal-code.json
          test -s data/api/v1/criminal-law/dc-code.json
          test -s data/api/v1/criminal-law/title18-index.json
          test -s data/api/v1/criminal-law/title18-search.json
          test -s data/api/v1/criminal-law/sentencing.json
          test ! -e data/api/v1/criminal-law/documents.json

      - name: Run website validation
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_encoding.py
          python tools/check_title42_build.py
          python tools/audit_applied_material.py
          python tools/reconcile_repealed_laws.py --check
          python -m unittest discover -s tests -p "test_*.py" -v
          node --check assets/js/public-laws.js
          node --check assets/js/criminal-law.js
          node --check assets/js/research-tools.js
          node --check assets/js/constitution.js
          node --check assets/js/section-research.js
          node --check assets/js/constitution-research.js
          node --check assets/js/code-changes.js
          python -m py_compile tools/build_constitution.py tools/build_criminal_law_api.py tools/include_dc_booking_charges.py tools/harden_roblox_criminal_api.py tools/finalize_roblox_criminal_api.py tools/build_criminal_law_routes.py tools/apply_current_law_notes.py tools/apply_current_law_sections.py tools/augment_public_laws_with_current_laws.py tools/filter_public_laws_for_publication.py tools/build_section_history.py tools/build_version_history.py tools/build_reference_graph.py tools/build_code_api.py
          python tools/harden_roblox_criminal_api.py --check
          python tools/finalize_roblox_criminal_api.py --check
          node --test tests/*.mjs

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('data/public-laws.json').read_text(encoding='utf-8'))
          assert payload['counts']['total'] == 273
          assert payload['counts']['active'] == 144
          assert payload['counts']['repealed'] == 129
          assert len(payload['laws']) == 273
          assert payload['counts']['actions'] == sum(
              law['action_count'] for law in payload['laws']
          )
          assert all(law['status'] in {'active', 'repealed'} for law in payload['laws'])
          assert all(law['actions'] is not None for law in payload['laws'])
          assert all(
              action['result_label'] == 'Historical disposition'
              for law in payload['laws'] if law['status'] == 'repealed'
              for action in law['actions']
          )

          laws = {law['public_law']: law for law in payload['laws']}
          assert {'41-271', '42-272', '42-273', '42-274'} <= set(laws)
          assert laws['41-271']['status'] == 'active'
          assert laws['42-272']['status'] == 'active'
          assert laws['42-273']['status'] == 'active'
          assert laws['42-274']['status'] == 'active'
          assert laws['42-274']['trello_url'] == 'https://trello.com/c/DAwGab9j'

          def sections(law_number, title):
              return {
                  int(target['section'])
                  for target in laws[law_number]['targets']
                  if target.get('title') == str(title)
                  and str(target.get('section') or '').isdigit()
              }

          assert set(range(9701, 9717)) <= sections('42-272', 40)
          assert set(range(1801, 1816)) <= sections('42-273', 6)
          assert set(range(7001, 7020)) <= sections('42-274', 2)
          assert set(range(5001, 5008)) <= sections('41-271', 50)
          assert set(range(10001, 10012)) <= sections('41-271', 15)
          assert set(range(2501, 2505)) <= sections('41-271', 5)
          assert set(range(2308, 2315)) <= sections('41-271', 5)
          assert 205 in sections('41-271', 18)
          print('Public-law index validation passed.')
          PY

          python - <<'PY'
          import json
          from pathlib import Path

          history = json.loads(Path('data/section-history/manifest.json').read_text(encoding='utf-8'))
          versions = json.loads(Path('data/version-history/manifest.json').read_text(encoding='utf-8'))
          references = json.loads(Path('data/references/manifest.json').read_text(encoding='utf-8'))
          code_api = json.loads(Path('data/api/v1/code/index.json').read_text(encoding='utf-8'))

          assert history['counts']['changed'] > 0
          assert versions['counts']['versioned_sections'] > 0
          assert references['counts']['sections'] > 0
          assert code_api['titles']
          assert code_api.get('criminal_law_api_unchanged') is True
          print('Legal research publication outputs passed.')
          PY

          python - <<'PY'
          import json
          from pathlib import Path

          base = Path('data/api/v1/criminal-law')
          manifest = json.loads((base / 'manifest.json').read_text(encoding='utf-8'))
          charges = json.loads((base / 'charges.json').read_text(encoding='utf-8'))
          dc = json.loads((base / 'dc-code.json').read_text(encoding='utf-8'))
          title18 = json.loads((base / 'title18-index.json').read_text(encoding='utf-8'))
          title18_search = json.loads((base / 'title18-search.json').read_text(encoding='utf-8'))
          sentencing = json.loads((base / 'sentencing.json').read_text(encoding='utf-8'))

          assert manifest['schema_version'] == '1.0'
          assert manifest['api_base'].startswith('https://')
          assert manifest['roblox']['display_contract']['charge_only'] is True
          assert manifest['roblox']['display_contract']['roblox_safe_only'] is True
          assert manifest['roblox']['display_contract']['fail_closed'] is True
          assert manifest['roblox']['display_contract']['never_display_unlisted_sections'] is True
          assert manifest['roblox']['public_surface']['advertised'] is False
          assert manifest['roblox']['public_surface']['charge_catalog_only'] is True
          assert manifest['roblox']['public_surface']['source_documents_exposed'] is False
          assert 'source_documents' not in manifest['endpoints']
          assert 'documents' not in manifest['endpoints']
          assert 'federal_code' not in manifest['endpoints']
          assert not (base / 'documents.json').exists()
          assert not (base / 'federal-code.json').exists()

          assert charges['display_contract']['charge_only'] is True
          assert charges['display_contract']['roblox_safe_only'] is True
          assert charges['display_contract']['fail_closed'] is True
          assert charges['counts']['total'] == len(charges['charges'])
          assert charges['counts']['dc_code'] == len(dc['sections'])
          assert charges['counts']['title18'] == len(title18['sections'])
          assert 'federal_code' not in charges['counts']
          assert charges['counts']['dc_code'] > 0
          assert charges['counts']['title18'] > 0
          assert set(charges['available_local_codes']) == {'dc-criminal-code-federalized'}

          assert all(item.get('is_offense') is True for item in dc['sections'])
          assert all(item.get('is_charge') is True for item in title18['sections'])
          assert all(item.get('is_charge') is True for item in charges['charges'])
          assert all(item.get('content_policy') == 'roblox_safe' for item in charges['charges'])
          assert all(charge['details_url'].startswith('https://') for charge in charges['charges'])
          assert all(charge['web_url'].startswith('https://') for charge in charges['charges'])
          assert not any(charge['source'] == 'federal-criminal-code-2025' for charge in charges['charges'])
          exclusions = {item['id']: item['reason'] for item in manifest['excluded_sources']}
          assert 'duplicat' in exclusions['federal-criminal-code-2025'].lower()

          assert any(item['section'] == '111' for item in title18['sections'])
          assert title18_search['count'] == title18['counts']['sections']
          assert {item['id'] for item in title18_search['entries']} == {item['id'] for item in title18['sections']}
          assert (base / 'title18' / '111.json').is_file()

          d201 = next(item for item in dc['sections'] if item['section'] == '201')
          assert d201['offense_class'] == 'E'
          assert d201['web_url'].endswith('/criminal/dc/201/')

          assert sentencing['rules']['crosswalk_status'] == 'not_expressly_defined'
          print('Criminal-law API charge-only/safety validation passed.')
          PY

          grep -q 'Article III - The Judiciary' data/constitution.txt
          grep -q 'Amendment XXVII - Commerce Regulation Authority' data/constitution.txt
          ! grep -q 'Use the Roblox API' criminal-law.html
          ! grep -q 'api-docs' criminal-law.html
          ! grep -q 'Roblox server example' criminal-law.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static website only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp index.html 404.html public-laws.html criminal-law.html constitution.html api.html changes.html _site/
          cp -a assets _site/assets
          cp -a data _site/data
          cp -a usc _site/usc

          # Title 42 is published through chunked files in data/title-42.
          rm -f _site/usc/usc42.xml
          touch _site/.nojekyll

          # Discord and other crawlers do not run the SPA's JavaScript fallback.
          # Generate a small 200-response HTML shell with static metadata for
          # every U.S. Code title and section route.
          python tools/build_social_routes.py --site-dir _site

          # Build only permanent pages for the hardened charge catalog.
          python tools/build_criminal_law_routes.py --site-dir _site

          test -s _site/index.html
          test -s _site/404.html
          test -s _site/public-laws.html
          test -s _site/criminal-law.html
          test -s _site/constitution.html
          test -s _site/api.html
          test -s _site/changes.html
          test -s _site/assets/js/public-laws.js
          test -s _site/assets/js/criminal-law.js
          test -s _site/assets/js/research-tools.js
          test -s _site/assets/js/constitution.js
          test -s _site/assets/js/section-research.js
          test -s _site/assets/css/public-laws.css
          test -s _site/assets/css/criminal-law.css
          test -s _site/assets/css/criminal-law-static.css
          test -s _site/assets/css/research-tools.css
          test -s _site/assets/css/constitution.css
          test -s _site/data/constitution.txt
          test -s _site/data/constitution-meta.json
          test -s _site/data/titles.json
          test -s _site/data/public-laws.json
          test -s _site/data/section-history/manifest.json
          test -s _site/data/version-history/manifest.json
          test -s _site/data/references/manifest.json
          test -s _site/data/api/v1/code/index.json
          test -s _site/data/social-routes.json
          test -s _site/data/title-42/manifest.json
          test -s _site/data/api/v1/criminal-law/manifest.json
          test -s _site/data/api/v1/criminal-law/charges.json
          test -s _site/data/api/v1/criminal-law/title18-search.json
          test -s _site/data/api/v1/criminal-law/title18/111.json
          test ! -e _site/data/api/v1/criminal-law/documents.json
          test ! -e _site/data/api/v1/criminal-law/federal-code.json

          test -s _site/cite/18/111/index.html
          test -s _site/cite/28/530B/index.html
          test -s _site/cite/42/1983/index.html
          test -s _site/cite/2/7001/index.html
          test -s _site/cite/2/7019/index.html
          test -s _site/criminal/index.html
          test ! -e _site/criminal/fcc
          test -s _site/criminal/dc/201/index.html
          test -s _site/criminal/title18/111/index.html
          test -s _site/sitemap-criminal.xml
          test -s _site/robots.txt

          grep -q 'property="og:title"' _site/cite/18/111/index.html
          grep -q 'property="og:image"' _site/cite/18/111/index.html
          grep -q '18 U.S.C. § 111' _site/cite/18/111/index.html
          grep -q '2 U.S.C. § 7001' _site/cite/2/7001/index.html
          grep -q '2 U.S.C. § 7019' _site/cite/2/7019/index.html
          grep -q 'D.C. Criminal Code § 201' _site/criminal/dc/201/index.html
          grep -q '18 U.S.C. § 111' _site/criminal/title18/111/index.html
          grep -q '<urlset' _site/sitemap-criminal.xml
          grep -q '/criminal/title18/111/' _site/sitemap-criminal.xml
          ! grep -q '/criminal/fcc/' _site/sitemap-criminal.xml
          grep -q 'Sitemap:' _site/robots.txt
          grep -q 'Disallow: /us-code/data/api/v1/criminal-law/' _site/robots.txt
          ! grep -q '/data/api/v1/criminal-law/' _site/sitemap-criminal.xml
          ! grep -q 'Roblox server example' _site/criminal-law.html

          test ! -e _site/usc/usc42.xml
          test ! -e _site/audit
          test ! -e _site/codification
          test ! -e _site/tools
          test ! -e _site/tests

          SECTION_COUNT=$(find _site/data/title-42 -type f -name "*.xml" | wc -l)
          if (( SECTION_COUNT < 8000 )); then
            echo "::error::The generated site contains too few Title 42 sections: $SECTION_COUNT"
            exit 1
          fi

          SITE_BYTES=$(du -sb _site | cut -f1)
          SAFE_LIMIT=$((900 * 1024 * 1024))
          echo "Static site size: $SITE_BYTES bytes"
          if (( SITE_BYTES > SAFE_LIMIT )); then
            echo "::error::Generated site exceeds the 900 MiB safety limit."
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
          retention-days: 1

  deploy:
    name: Deploy GitHub Pages
    if: ${{ github.event_name != 'pull_request' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
