name: Refresh Constitution publication

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-pages-build:
    name: Trigger Pages rebuild
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch U.S. Code Pages workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'jekyll-gh-pages.yml',
              ref: 'main'
            });
